<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界博士 | 世界195か国を冒険しよう</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#eaf7ff,#f8fcff);color:#25364a;min-height:100vh}header{text-align:center;padding:48px 20px 26px}h1{margin:0 0 12px;font-size:clamp(40px,7vw,72px)}.subtitle{font-size:18px;color:#52677d}.progress-card{width:min(500px,90%);margin:28px auto;padding:22px;background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(43,100,150,.12)}.progress-text{font-size:20px;font-weight:bold;margin-bottom:12px}.progress-bar{height:16px;background:#e5edf5;border-radius:999px;overflow:hidden}.progress-fill{width:0;height:100%;background:linear-gradient(90deg,#38bdf8,#2563eb)}main{width:min(1200px,94%);margin:auto;padding-bottom:60px}.map-area{background:#fff;border-radius:28px;padding:36px 20px;box-shadow:0 10px 40px rgba(43,100,150,.12)}.map-area h2{text-align:center;margin-top:0}.lead{text-align:center;color:#64748b}.toolbar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:24px auto}.search{width:min(520px,100%);padding:14px 18px;border:2px solid #dbe7f2;border-radius:14px;font-size:16px;outline:none}.search:focus{border-color:#38bdf8}.count{font-weight:bold;color:#2563eb}.countries{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.country-card{padding:20px 16px;border:2px solid #e5edf5;border-radius:18px;background:#fbfdff;cursor:pointer;transition:.2s;text-align:center}.country-card:hover,.country-card:focus{transform:translateY(-4px);border-color:#38bdf8;box-shadow:0 10px 25px rgba(43,100,150,.12);outline:none}.flag{font-size:40px;line-height:1}.code{font-size:13px;color:#94a3b8;margin-top:8px}.country-name{margin-top:7px;font-size:17px;font-weight:bold;min-height:2.6em;display:grid;place-items:center}.status{margin-top:8px;color:#64748b;font-size:14px}.empty{text-align:center;color:#64748b;padding:40px;grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-card{width:min(430px,100%);background:#fff;border-radius:24px;padding:30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal-flag{font-size:64px}.modal h3{font-size:26px;margin:12px 0}.modal p{color:#64748b;line-height:1.8}.close{border:0;border-radius:12px;background:#2563eb;color:#fff;padding:12px 22px;font-size:16px;cursor:pointer}footer{text-align:center;padding:30px;color:#789}@media(max-width:560px){header{padding-top:34px}.map-area{padding:28px 14px}.countries{grid-template-columns:repeat(2,minmax(0,1fr))}.country-card{padding:16px 10px}.country-name{font-size:15px}}
  </style>
</head>
<body>
  <header>
    <h1>🌍 世界博士</h1>
    <p class="subtitle">世界195か国から選んで、その国の博士になろう！</p>
    <div class="progress-card">
      <div class="progress-text">🎓 世界博士度：0 / 195か国</div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>
  </header>
  <main>
    <section class="map-area">
      <h2>どの国を冒険する？</h2>
      <p class="lead">すべての国がクリック対象です。国名で検索もできます。</p>
      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="国名を検索（例：日本、ナウル、サントメ）" aria-label="国名を検索">
        <span id="count" class="count">195か国</span>
      </div>
      <div id="countries" class="countries"></div>
    </section>
  </main>
  <footer>世界195か国を知れば、世界はもっと面白くなる 🌍</footer>
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div id="modal-flag" class="modal-flag"></div>
      <h3 id="modal-title"></h3>
      <p>博士コースへの入口です。次の実装で、地理・歴史・文化・暮らし・クイズを追加します。</p>
      <button class="close" type="button" onclick="closeModal()">閉じる</button>
    </div>
  </div>
  <script src="countries.js"></script>
  <script>
    const list=document.getElementById('countries');
    const search=document.getElementById('search');
    const count=document.getElementById('count');
    const flagEmoji=code=>[...code].map(c=>String.fromCodePoint(127397+c.charCodeAt())).join('');
    function render(query=''){
      const q=query.trim().toLowerCase();
      const filtered=COUNTRIES.filter(([code,name])=>name.toLowerCase().includes(q)||code.toLowerCase().includes(q));
      count.textContent=`${filtered.length}か国`;
      list.innerHTML=filtered.length?filtered.map(([code,name])=>`<button class="country-card" type="button" onclick="openCourse('${code}','${name.replaceAll("'","\\'")}')"><div class="flag">${flagEmoji(code)}</div><div class="code">${code}</div><div class="country-name">${name}</div><div class="status">博士を目指す →</div></button>`).join(''):'<div class="empty">該当する国が見つかりませんでした。</div>';
    }
    function openCourse(code,name){document.getElementById('modal-flag').textContent=flagEmoji(code);document.getElementById('modal-title').textContent=`${name}博士コース`;document.getElementById('modal').classList.add('open')}
    function closeModal(){document.getElementById('modal').classList.remove('open')}
    search.addEventListener('input',e=>render(e.target.value));
    document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    render();
  </script>
</body>
</html>
