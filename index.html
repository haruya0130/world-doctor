<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>世界博士 | 世界195か国を冒険しよう</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, #eaf7ff 0%, #f8fcff 100%);
      color: #25364a;
      min-height: 100vh;
    }

    .connection-badge {
      width: fit-content;
      margin: 18px auto 0;
      padding: 10px 16px;
      background: #ecfdf5;
      border: 1px solid #86efac;
      border-radius: 999px;
      color: #166534;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 14px rgba(22, 101, 52, 0.08);
    }

    header {
      text-align: center;
      padding: 40px 20px 30px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(40px, 7vw, 72px);
    }

    .subtitle {
      font-size: 18px;
      color: #52677d;
    }

    .progress-card {
      width: min(500px, 90%);
      margin: 30px auto;
      padding: 22px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(43, 100, 150, 0.12);
    }

    .progress-text {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .progress-bar {
      width: 100%;
      height: 16px;
      background: #e5edf5;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #2563eb);
    }

    main {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding-bottom: 60px;
    }

    .map-area {
      background: white;
      min-height: 400px;
      border-radius: 28px;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(43, 100, 150, 0.12);
    }

    .earth {
      font-size: 120px;
      margin: 20px 0;
    }

    .countries {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
      margin-top: 35px;
    }

    .country-card {
      padding: 24px;
      border: 2px solid #e5edf5;
      border-radius: 18px;
      background: #fbfdff;
      cursor: pointer;
      transition: 0.2s;
    }

    .country-card:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
      box-shadow: 0 10px 25px rgba(43, 100, 150, 0.12);
    }

    .flag {
      font-size: 50px;
    }

    .country-name {
      margin-top: 10px;
      font-size: 19px;
      font-weight: bold;
    }

    .status {
      margin-top: 8px;
      color: #64748b;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #789;
    }
  </style>
</head>

<body>
  <div class="connection-badge">✅ ChatGPTからGitHubへ直接更新できました</div>

  <header>
    <h1>🌍 世界博士</h1>
    <p class="subtitle">
      世界地図から国を選んで、その国の博士になろう！
    </p>

    <div class="progress-card">
      <div class="progress-text">
        🎓 世界博士度：0 / 195か国
      </div>

      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>
  </header>

  <main>
    <section class="map-area">

      <h2>どの国を冒険する？</h2>

      <div class="earth">🌏</div>

      <p>
        次は、ここにクリックできる本物の世界地図を実装します。
      </p>

      <div class="countries">

        <div class="country-card" onclick="selectCountry('日本')">
          <div class="flag">🇯🇵</div>
          <div class="country-name">日本</div>
          <div class="status">博士を目指す →</div>
        </div>

        <div class="country-card" onclick="selectCountry('ナウル')">
          <div class="flag">🇳🇷</div>
          <div class="country-name">ナウル</div>
          <div class="status">博士を目指す →</div>
        </div>

        <div class="country-card" onclick="selectCountry('サントメ・プリンシペ')">
          <div class="flag">🇸🇹</div>
          <div class="country-name">サントメ・プリンシペ</div>
          <div class="status">博士を目指す →</div>
        </div>

      </div>
    </section>
  </main>

  <footer>
    世界195か国を知れば、世界はもっと面白くなる 🌍
  </footer>

  <script>
    function selectCountry(country) {
      alert(country + "博士への冒険が始まります！ 🎓");
    }
  </script>

</body>
</html>
